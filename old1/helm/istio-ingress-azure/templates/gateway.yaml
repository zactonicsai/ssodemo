{{- if include "ig.istioGateway" . }}
# The listeners. Applications attach VirtualServices with
#   gateways: ["{{ include "ig.gatewayNamespace" . }}/{{ .Values.istioGateway.name }}"]
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.istioGateway.name }}
  namespace: {{ include "ig.gatewayNamespace" . }}
  labels:
    {{- include "ig.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ig.gatewaySelector" . | nindent 4 }}
  servers:
    {{- if .Values.istioGateway.http.enabled }}
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        {{- toYaml .Values.istioGateway.hosts | nindent 8 }}
      {{- if and .Values.istioGateway.tls.enabled .Values.istioGateway.http.redirectToHttps }}
      tls:
        httpsRedirect: true
      {{- end }}
    {{- end }}
    {{- if .Values.istioGateway.tls.enabled }}
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        {{- toYaml .Values.istioGateway.hosts | nindent 8 }}
      tls:
        mode: {{ .Values.istioGateway.tls.mode }}
        {{- if ne .Values.istioGateway.tls.mode "PASSTHROUGH" }}
        credentialName: {{ .Values.istioGateway.tls.credentialName }}
        minProtocolVersion: {{ .Values.istioGateway.tls.minProtocolVersion }}
        {{- end }}
    {{- end }}
{{- end }}
