{{- if include "ig.gatewayAPI" . }}
{{- $g := .Values.gatewayAPI }}
{{- if $g.infrastructure.enabled }}
# Istio reads deployment tuning for the generated gateway pods from this ConfigMap (infrastructure.parametersRef).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $g.name }}-infra
  labels:
    {{- include "ig.labels" . | nindent 4 }}
data:
  deployment: |
    spec:
      {{- if not $g.infrastructure.autoscaling.enabled }}
      replicas: {{ $g.infrastructure.replicas }}
      {{- end }}
      template:
        spec:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: {{ $g.name }}
          containers:
            - name: istio-proxy
              resources:
                {{- toYaml $g.infrastructure.resources | nindent 16 }}
  {{- if $g.infrastructure.autoscaling.enabled }}
  horizontalPodAutoscaler: |
    spec:
      minReplicas: {{ $g.infrastructure.autoscaling.minReplicas }}
      maxReplicas: {{ $g.infrastructure.autoscaling.maxReplicas }}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: {{ $g.infrastructure.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  podDisruptionBudget: |
    spec:
      minAvailable: 1
---
{{- end }}
# Kubernetes Gateway API Gateway. The AKS managed Istio controller (istio.aks.azure.com/gateway-controller)
# creates Deployment + LoadBalancer Service "{{ $g.name }}-{{ $g.gatewayClassName }}" for it, copying
# spec.infrastructure.annotations onto the Service — that is how the Azure LB settings get applied.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  labels:
    {{- include "ig.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $g.gatewayClassName }}
  infrastructure:
    annotations:
      {{- include "ig.azureAnnotations" . | nindent 6 }}
    labels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if $g.infrastructure.enabled }}
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $g.name }}-infra
    {{- end }}
  {{- with .Values.azure.staticIP }}
  addresses:
    - type: IPAddress
      value: {{ . | quote }}
  {{- end }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      {{- if $g.hosts }}
      hostname: {{ index $g.hosts 0 | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: {{ $g.allowedRouteNamespaces }}
          {{- if eq $g.allowedRouteNamespaces "Selector" }}
          selector:
            {{- toYaml $g.allowedRouteSelector | nindent 12 }}
          {{- end }}
    {{- if $g.tls.enabled }}
    - name: https
      port: 443
      protocol: HTTPS
      {{- if $g.hosts }}
      hostname: {{ index $g.hosts 0 | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $g.tls.certificateRef }}
      allowedRoutes:
        namespaces:
          from: {{ $g.allowedRouteNamespaces }}
          {{- if eq $g.allowedRouteNamespaces "Selector" }}
          selector:
            {{- toYaml $g.allowedRouteSelector | nindent 12 }}
          {{- end }}
    {{- end }}
{{- if and $g.tls.enabled $g.tls.redirectHttp }}
---
# http -> https redirect, attached to the http listener only
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $g.name }}-https-redirect
  labels:
    {{- include "ig.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $g.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
