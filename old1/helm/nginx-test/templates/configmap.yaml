apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  labels: { app: {{ .Release.Name }} }
data:
  index.html: |
    <!doctype html><html><head><title>istio gateway test</title>
    <style>body{font-family:system-ui;margin:3rem;background:#111;color:#eee}code{background:#333;padding:.1em .4em}</style></head>
    <body><h1>It works — nginx behind the Istio ingress gateway</h1>
    <p>Release <code>{{ .Release.Name }}</code> in namespace <code>{{ .Release.Namespace }}</code>, gateway <code>{{ .Values.gateway }}</code>.</p>
    <p>Look at the response headers: <code>server: istio-envoy</code> means the request went through Envoy.</p>
    </body></html>
  default.conf: |
    server {
      listen 8080;
      location / { root /usr/share/nginx/html; index index.html; add_header X-Served-By $hostname always; }
      location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    }
