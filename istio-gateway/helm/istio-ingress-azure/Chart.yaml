apiVersion: v2
name: istio-ingress-azure
description: >-
  Istio ingress gateway for AKS: an injected gateway Deployment, an Azure Load Balancer Service
  (public or internal, static IP, DNS label, health probes) and the Istio Gateway resource that
  opens HTTP/HTTPS listeners. Also works with the AKS Istio add-on (mode=aks-addon), where it only
  creates the Gateway resource against the add-on's managed ingress.
type: application
version: 0.1.0
appVersion: "1.31"
keywords: [istio, aks, azure, ingress, gateway]
