{{- if include "ig.deploy" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ig.name" . }}
  labels:
    {{- include "ig.labels" . | nindent 4 }}
  annotations:
    {{- include "ig.azureAnnotations" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- with .Values.azure.staticIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "ig.selectorLabels" . | nindent 4 }}
  ports:
    - name: status-port
      port: {{ .Values.service.ports.status }}
      targetPort: 15021
      protocol: TCP
    - name: http2
      port: {{ .Values.service.ports.http }}
      targetPort: 8080
      protocol: TCP
    - name: https
      port: {{ .Values.service.ports.https }}
      targetPort: 8443
      protocol: TCP
    {{- with .Values.service.extraPorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
