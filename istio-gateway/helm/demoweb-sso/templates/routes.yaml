{{- $gwNs := include "sso.gwNs" . }}
{{- $gwName := include "sso.gwName" . }}
{{- $kcPath := .Values.keycloak.relativePath }}
{{- if eq .Values.routeKind "httproute" }}
# Gateway API routes (aks-gateway-api mode). Two routes on the same Gateway:
#   <kcPath>/*  -> keycloak (login pages, tokens, admin console)      — public by nature
#   /*          -> oauth2-proxy -> (after login) the apps              — everything else requires a session
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  labels:
    {{- include "sso.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gwName }}
      namespace: {{ $gwNs }}
  {{- with .Values.hostname }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: {{ $kcPath | quote }} }
      backendRefs:
        - name: keycloak
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sso-apps
  labels:
    {{- include "sso.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gwName }}
      namespace: {{ $gwNs }}
  {{- with .Values.hostname }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: oauth2-proxy
          port: 4180
{{- else }}
# Istio API routes (selfmanaged / aks-addon modes), bound to the Istio Gateway.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: sso-ingress
  labels:
    {{- include "sso.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ default "*" .Values.hostname | quote }}
  gateways:
    - {{ .Values.gateway }}
  http:
    - name: keycloak
      match:
        - uri: { prefix: {{ printf "%s/" $kcPath | quote }} }
        - uri: { exact: {{ $kcPath | quote }} }
      route:
        - destination: { host: keycloak.{{ .Release.Namespace }}.svc.cluster.local, port: { number: 8080 } }
      timeout: 60s
    - name: sso-apps
      match:
        - uri: { prefix: / }
      route:
        - destination: { host: oauth2-proxy.{{ .Release.Namespace }}.svc.cluster.local, port: { number: 4180 } }
      timeout: 60s
{{- end }}
