{{- if .Values.web.enabled }}
# The portal: index.html + app.py (stdlib-only Python) shipped as a ConfigMap, run by the plain python image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app
  labels:
    {{- include "sso.labels" . | nindent 4 }}
data:
  app.py: |
    {{- .Files.Get "files/web/app.py" | nindent 4 }}
  index.html: |
    {{- .Files.Get "files/web/index.html" | nindent 4 }}
{{- end }}
