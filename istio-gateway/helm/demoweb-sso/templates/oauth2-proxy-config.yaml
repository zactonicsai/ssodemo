{{- $o := .Values.oauth2Proxy }}
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy
  labels:
    {{- include "sso.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ $o.clientSecret | quote }}
  cookie-secret: {{ $o.cookieSecret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy
  labels:
    {{- include "sso.labels" . | nindent 4 }}
data:
  oauth2-proxy.cfg: |
    http_address = "0.0.0.0:4180"
    reverse_proxy = true
    provider = "oidc"
    provider_display_name = "Keycloak"
    client_id = {{ .Values.keycloak.realm.oidcClientId | quote }}
    # Browser-facing URLs use publicUrl; server-to-server calls use the in-cluster Service (no hairpin through the LB).
    oidc_issuer_url = {{ include "sso.issuer" . | quote }}
    skip_oidc_discovery = true
    login_url  = "{{ include "sso.issuer" . }}/protocol/openid-connect/auth"
    redeem_url = "{{ include "sso.issuerInternal" . }}/protocol/openid-connect/token"
    oidc_jwks_url = "{{ include "sso.issuerInternal" . }}/protocol/openid-connect/certs"
    profile_url = "{{ include "sso.issuerInternal" . }}/protocol/openid-connect/userinfo"
    redirect_url = "{{ .Values.publicUrl }}/oauth2/callback"
    code_challenge_method = "S256"
    scope = "openid email profile"
    email_domains = {{ toJson $o.emailDomains }}
    {{- if $o.allowedRole }}
    allowed_roles = [{{ $o.allowedRole | quote }}]
    {{- end }}
    {{- if $o.allowedGroups }}
    allowed_groups = {{ toJson $o.allowedGroups }}
    {{- end }}
    oidc_groups_claim = "groups"          # Keycloak group membership -> X-Forwarded-Groups for the apps
    skip_provider_button = true
    cookie_name = "_demoweb_sso"
    cookie_secure = {{ ternary "true" "false" $o.cookieSecure }}
    cookie_samesite = "lax"
    cookie_expire = "8h"
    cookie_refresh = "5m"
    set_xauthrequest = true
    pass_access_token = false
    pass_user_headers = true
    skip_auth_routes = [ "^/healthz$" ]
    whitelist_domains = [ {{ (trimPrefix "https://" (trimPrefix "http://" .Values.publicUrl)) | quote }} ]
    # one upstream per app; the request path is forwarded unchanged (so /app2/x reaches svc2:port/app2/x)
    upstreams = [
    {{- range .Values.apps }}
      "http://{{ .service }}.{{ default $.Release.Namespace .namespace }}.svc.cluster.local:{{ .port }}{{ .path }}",
    {{- end }}
    ]
