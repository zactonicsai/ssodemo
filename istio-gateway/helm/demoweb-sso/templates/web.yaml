{{- if .Values.web.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels:
    {{- include "sso.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    {{- include "sso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, version: v1 }
      annotations:
        checksum/html: {{ include (print $.Template.BasePath "/web-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: web
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101 }
      containers:
        - name: nginx
          image: {{ .Values.web.image | quote }}
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 20 }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html/index.html, subPath: index.html }
            - { name: html, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - name: html
          configMap: { name: web-html }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
    {{- include "sso.labels" . | nindent 4 }}
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
{{- end }}
