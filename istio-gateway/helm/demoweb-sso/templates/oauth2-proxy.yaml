{{- $o := .Values.oauth2Proxy }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oauth2-proxy
  labels:
    {{- include "sso.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels:
    app: oauth2-proxy
    {{- include "sso.labels" . | nindent 4 }}
spec:
  replicas: {{ $o.replicas }}
  selector:
    matchLabels: { app: oauth2-proxy }
  template:
    metadata:
      labels: { app: oauth2-proxy, version: v1 }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/oauth2-proxy-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: oauth2-proxy
      securityContext: { runAsNonRoot: true, runAsUser: 2000 }
      containers:
        - name: oauth2-proxy
          image: {{ $o.image | quote }}
          args: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: cookie-secret } }
          ports: [{ name: http, containerPort: 4180 }]
          readinessProbe: { httpGet: { path: /ping, port: http }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /ping, port: http }, periodSeconds: 20 }
          resources:
            {{- toYaml $o.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/oauth2-proxy, readOnly: true }
      volumes:
        - name: config
          configMap: { name: oauth2-proxy }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  labels:
    app: oauth2-proxy
    {{- include "sso.labels" . | nindent 4 }}
spec:
  selector: { app: oauth2-proxy }
  ports:
    - { name: http, port: 4180, targetPort: http }
