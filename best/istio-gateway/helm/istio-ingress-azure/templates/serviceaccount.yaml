{{- if include "ig.deploy" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ig.name" . }}
  labels:
    {{- include "ig.labels" . | nindent 4 }}
---
# The gateway reads TLS Secrets in its own namespace through SDS (credentialName on the Gateway).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ig.name" . }}-sds
  labels:
    {{- include "ig.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ig.name" . }}-sds
  labels:
    {{- include "ig.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ig.name" . }}-sds
subjects:
  - kind: ServiceAccount
    name: {{ include "ig.name" . }}
{{- end }}
