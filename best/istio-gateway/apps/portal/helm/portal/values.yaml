# apps/portal/install.sh fills publicUrl, keycloak.*, secrets; by hand see README.md

publicUrl: http://CHANGE-ME          # same as the keycloak release's publicUrl
path: /                              # where this app is published on the gateway ("/" = the root app)

# ---- route binding ----------------------------------------------------------------------------------------
routeKind: httproute                 # httproute | virtualservice
gateway: demoweb/default-gateway
hostname: ""

# ---- the Keycloak this app authenticates against (installed by the platform) --------------------------------
keycloak:
  publicUrl: http://CHANGE-ME/auth   # browser-facing
  internalUrl: http://keycloak.demoweb.svc.cluster.local:8080/auth   # pod-to-pod
  realm: demoweb
  adminSecret: keycloak-admin        # Secret (in this namespace) with username/password, used by the client-register Job
  image: quay.io/keycloak/keycloak:26.0.7   # for kcadm in the Jobs

# ---- this app's OIDC client (created in Keycloak by a Helm hook Job) ---------------------------------------
client:
  id: portal                         # Keycloak clientId
  secret: CHANGE-ME                  # generated by install.sh
  registerJob: true                  # false = you created the client yourself

oauth2Proxy:
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
  cookieSecret: CHANGE-ME            # 32 bytes URL-safe base64 (install.sh generates it)
  cookieName: _portal_sso
  cookieSecure: false                # true once publicUrl is https://
  allowedGroups: [developers]        # Keycloak groups allowed to log in ([] = any realm user)
  emailDomains: ["*"]
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# ---- the app itself: Python web + stub API from files/web/ -------------------------------------------------
web:
  image: python:3.12-slim
  replicas: 2
  requireAuth: true
  adminGroup: admins
  namespacePrefix: ws-
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { cpu: 300m, memory: 128Mi }

# ---- access control ----------------------------------------------------------------------------------------
policies:
  networkPolicy: true                # web reachable only from oauth2-proxy pods (any cluster)
  istio: true                        # PeerAuthentication/AuthorizationPolicy/VirtualService when the Istio CRDs exist
