global:
  # Public URLs used by browser redirects (adjust for Ingress or port-forward)
  keycloakPublicUrl: "http://keycloak.local:8080"
  nginxPublicUrl: "http://app.local:8081"

keycloak:
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.0.5"
    pullPolicy: IfNotPresent
  adminUser: admin
  # Override at install time: --set keycloak.adminPassword=<strong-secret>
  adminPassword: "ChangeMeAdmin123!"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

realm:
  name: demosso
  clientId: "http://app.local:8081/saml/metadata"
  demoUser:
    username: demouser
    email: demouser@example.com
    firstName: Demo
    lastName: User
    password: "DemoPassword123!"

nginx:
  replicas: 1
  image:
    repository: nginxinc/nginx-unprivileged
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  samlSidecar:
    image:
      repository: python
      tag: "3.12-alpine"
    sessionSecret: "ReplaceWith32ByteRandomHexString!"
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

keycloak:
  service:
    type: LoadBalancer
    port: 8080
    loadBalancerSourceRanges:
      - "68.32.112.68/32"

nginx:
  service:
    type: LoadBalancer
    port: 8081
    loadBalancerSourceRanges:
      - "68.32.112.68/32"