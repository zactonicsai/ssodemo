apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak-saml-demo.fullname" . }}-kc-secret
  labels:
    {{- include "keycloak-saml-demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN: {{ .Values.keycloak.adminUser | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
  SESSION_SECRET: {{ .Values.nginx.samlSidecar.sessionSecret | quote }}