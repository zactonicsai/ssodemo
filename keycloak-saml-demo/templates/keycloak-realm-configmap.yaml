apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak-saml-demo.fullname" . }}-realm-config
  labels:
    {{- include "keycloak-saml-demo.labels" . | nindent 4 }}
data:
  demosso-realm.json: |
    {
      "realm": {{ .Values.realm.name | quote }},
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "users": [
        {
          "username": {{ .Values.realm.demoUser.username | quote }},
          "enabled": true,
          "emailVerified": true,
          "email": {{ .Values.realm.demoUser.email | quote }},
          "firstName": {{ .Values.realm.demoUser.firstName | quote }},
          "lastName": {{ .Values.realm.demoUser.lastName | quote }},
          "credentials": [
            {
              "type": "password",
              "value": {{ .Values.realm.demoUser.password | quote }},
              "temporary": false
            }
          ],
          "realmRoles": ["default-roles-{{ .Values.realm.name }}"]
        }
      ],
      "clients": [
        {
          "clientId": {{ .Values.realm.clientId | quote }},
          "name": "nginx-saml-sp",
          "enabled": true,
          "protocol": "saml",
          "adminUrl": "{{ .Values.global.nginxPublicUrl }}/saml/acs",
          "baseUrl": "{{ .Values.global.nginxPublicUrl }}/",
          "redirectUris": [
            "{{ .Values.global.nginxPublicUrl }}/*"
          ],
          "frontchannelLogout": true,
          "attributes": {
            "saml.authnstatement": "true",
            "saml.server.signature": "true",
            "saml.assertion.signature": "true",
            "saml.client.signature": "false",
            "saml.force.post.binding": "true",
            "saml_name_id_format": "username",
            "saml_assertion_consumer_url_post": "{{ .Values.global.nginxPublicUrl }}/saml/acs",
            "saml_single_logout_service_url_redirect": "{{ .Values.global.nginxPublicUrl }}/saml/sls"
          },
          "protocolMappers": [
            {
              "name": "X500 email",
              "protocol": "saml",
              "protocolMapper": "saml-user-property-mapper",
              "consentRequired": false,
              "config": {
                "attribute.nameformat": "Basic",
                "user.attribute": "email",
                "friendly.name": "email",
                "attribute.name": "email"
              }
            },
            {
              "name": "username",
              "protocol": "saml",
              "protocolMapper": "saml-user-property-mapper",
              "consentRequired": false,
              "config": {
                "attribute.nameformat": "Basic",
                "user.attribute": "username",
                "friendly.name": "username",
                "attribute.name": "username"
              }
            }
          ]
        }
      ]
    }