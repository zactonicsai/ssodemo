apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak-saml-demo.fullname" . }}-nginx
  labels:
    {{- include "keycloak-saml-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nginx
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-conf
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
        - name: saml-sp-shim
          image: "{{ .Values.nginx.samlSidecar.image.repository }}:{{ .Values.nginx.samlSidecar.image.tag }}"
          command: ["python3", "/app/saml_sp.py"]
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak-saml-demo.fullname" . }}-kc-secret
                  key: SESSION_SECRET
          volumeMounts:
            - name: nginx-conf
              mountPath: /app/saml_sp.py
              subPath: saml_sp.py
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "keycloak-saml-demo.fullname" . }}-nginx-config