apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak-saml-demo.fullname" . }}-nginx
  labels:
    {{- include "keycloak-saml-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - name: http
      port: {{ .Values.nginx.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nginx